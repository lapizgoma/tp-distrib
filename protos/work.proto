syntax = "proto3";

package museum.works;

// Domain Models
message Work {
  int64 id = 1;
  string title = 2;
  int64 artist_id = 3;
  string artist_name = 4;
  string image_url = 5;
  int32 creation_year = 6;
  string technique = 7;
  string dimensions = 8;
  string era = 9;
  string topic = 10;
  string description = 11;
  string location = 12;
  string availability = 13;
  int32 estimated_duration_minutes = 14;
  repeated string topics = 15;
}

// Req 1: Personalized Tour
message TourCriteriaRequest {
  repeated string topics = 1;
  repeated string eras = 2;
  repeated string techniques = 3;
  int32 max_duration_minutes = 4;
  int32 max_works_count = 5;
  repeated string preferred_topics = 6;
  repeated string preferred_eras = 7;
  repeated string preferred_techniques = 8;
}

message WorkListResponse {
  repeated Work works = 1;
}

message TourPlanResponse {
  repeated Work works = 1;
  int32 total_duration_minutes = 2;
  repeated string rooms = 3;
  repeated string notes = 4;
}

// Req 2: Work Comparison
message CompareWorksRequest {
  repeated int64 work_ids = 1;
}

// Req 3: Work Recommendations
message RecommendationCriteriaRequest {
  int64 user_id = 1;
  int32 limit = 2;
}

// Req 4: Advanced Exploration
message ExplorationByEraRequest {
  string era = 1;
}

message ExplorationWorksResponse {
  string era = 1;
  repeated Work works = 2;
  repeated string associated_artists = 3;
}

// Service Definition
service WorkService {
  // 1. Tour Generation
  rpc SearchWorksForTour (TourCriteriaRequest) returns (TourPlanResponse);
  
  // 2. Comparison
  rpc GetWorksForComparison (CompareWorksRequest) returns (WorkListResponse);
  
  // 3. Recommendations
  rpc GetRecommendedWorks (RecommendationCriteriaRequest) returns (WorkListResponse);
  
  // 4. Advanced Exploration
  rpc GetWorksAndArtistsByEra (ExplorationByEraRequest) returns (ExplorationWorksResponse);
}