syntax = "proto3";

package museum.users;

// Req 1: Personalized Tour - Req 4: Advanced Exploration
message UserProfileRequest {
    int64 user_id = 1;
}

message UserPreferences {
    repeated string favorite_topics = 1;
    repeated string favorite_techniques = 2;
    repeated string favorite_eras = 3;
}

message UserProfileResponse {
    int64 user_id = 1;
    string email = 2;
    string first_name = 3;
    string last_name = 4;
    string role = 5;
    UserPreferences preferences = 6;
    repeated int64 interacted_work_ids = 7;
}

// Registro de Interacción (VIEW, COMMENT, etc.)
message RegisterInteractionRequest {
    int64 user_id = 1;
    int64 work_id = 2;
    string interaction_type = 3;
}

message RegisterInteractionResponse {
    bool success = 1;
}

// Service Definition
service UserService {
    rpc GetUserProfile (UserProfileRequest) returns (UserProfileResponse);
    rpc RegisterInteraction (RegisterInteractionRequest) returns (RegisterInteractionResponse);
}