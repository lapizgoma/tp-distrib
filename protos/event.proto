syntax = "proto3";

package museum.events;

// Domain Models
message Event {
  int64 id = 1;
  string title = 2;
  string description = 3;
  string datetime = 4;
  int32 duration = 5;
  string location = 6;
  string event_type = 7;
  string associated_era = 8;
}

// Req 1: Personalized Tour
message EventsByLocationsRequest {
  repeated string locations = 1;
  bool only_future = 2;
  string start_datetime = 3;
  string end_datetime = 4;
}

// Req 1: Personalized Tour
message EventsByEraRequest {
  string era = 1;
}

message EventListResponse {
  repeated Event events = 1;
}

// Service Definition
service EventService {
  rpc GetEventsByLocations (EventsByLocationsRequest) returns (EventListResponse);
  rpc GetEventsByEra (EventsByEraRequest) returns (EventListResponse);
}