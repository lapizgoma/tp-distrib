services:
  # Base de Datos MySQL
  mysql:
    image: mysql:8
    container_name: museo-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-museo_virtual}
      LANG: C.UTF-8
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Copio los scrips e inicializo la BD automáticamente
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka en modo KRaft (sin ZooKeeper)
  kafka:
    image: apache/kafka:4.3.1
    container_name: museo-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Crea los topics una sola vez, cuando el broker ya está sano
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: museo-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic museum.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic audit-dlq --partitions 1 --replication-factor 1
    restart: "no"

  # UI opcional para inspeccionar topics y mensajes durante la demo
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: museo-kafka-ui
    profiles: ["rest", "full"]
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # Servidor Backend REST (Java) - Perfil: rest
  backend-rest:
    profiles: ["rest", "full"]
    build:
      context: ./backend-rest
      dockerfile: Dockerfile
    container_name: museo-backend-rest
    ports:
      - "8081:8081"
    environment:
      # Database Configuration
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-museo_virtual}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-me-please-0123456789}
      JWT_ISSUER: ${JWT_ISSUER:-museo-virtual}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}

      # Kafka Configuration
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # Consumidor de auditoría (Go) - Perfil: rest, full
  audit:
    profiles: ["rest", "full"]
    build:
      context: ./audit
      dockerfile: Dockerfile
    container_name: museo-audit
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      TP_DISTRIB_DB_ADDR: ${DB_HOST:-mysql}:${DB_PORT:-3306}
      TP_DISTRIB_DB_USERNAME: ${DB_USER:-root}
      TP_DISTRIB_DB_PASSWORD: ${DB_PASSWORD:-root}
      TP_DISTRIB_DB_NAME: ${DB_NAME:-museo_virtual}

      # Kafka Configuration
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_EVENTS: museum.events
      KAFKA_TOPIC_DLQ: audit-dlq
      KAFKA_GROUP_ID: audit-service

      # Mismo JWT que backend-rest y backend-graphql
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-me-please-0123456789}
      JWT_ISSUER: ${JWT_ISSUER:-museo-virtual}

      PORT: "8083"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # Servidor Backend GraphQL (Go) - Perfil: graphql
  backend-graphql:
    profiles: ["graphql", "full"]
    build:
      context: ./backend-graphql
      dockerfile: Dockerfile
    container_name: museo-backend-graphql
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      TP_DISTRIB_DB_ADDR: ${DB_HOST:-mysql}:${DB_PORT:-3306}
      TP_DISTRIB_DB_USERNAME: ${DB_USER:-root}
      TP_DISTRIB_DB_PASSWORD: ${DB_PASSWORD:-root}
      TP_DISTRIB_DB_NAME: ${DB_NAME:-museo_virtual}

      # JWT Configuration (debe coincidir con el backend REST)
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-me-please-0123456789}
      JWT_ISSUER: ${JWT_ISSUER:-museo-virtual}

      PORT: "8082"
    depends_on:
      mysql:
        condition: service_healthy

  # Servidor Proxy (Go) - Perfil: proxy (requiere rest y graphql)
  backend-proxy:
    profiles: ["proxy", "full"]
    build:
      context: ./backend-proxy
      dockerfile: Dockerfile
    container_name: museo-backend-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      REST_TARGET: http://backend-rest:8081
      GQL_TARGET: http://backend-graphql:8082
      GATEWAY_TARGET: http://api-gateway:8090
      PORT: "8080"
    depends_on:
      - backend-rest
      - backend-graphql

  # Servidor gRPC Works (Python) - Perfil: grpc
  grpc-works:
    profiles: ["grpc", "full"]
    build:
      context: ./grpc-works
      dockerfile: Dockerfile
    container_name: museo-grpc-works
    restart: unless-stopped
    environment:
      GRPC_PORT: "50051"
      GRPC_MAX_WORKERS: "${GRPC_MAX_WORKERS:-10}"
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-museo_virtual}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_POOL_SIZE: "${DB_POOL_SIZE:-5}"
      ROOM_TRANSITION_MINUTES: "${ROOM_TRANSITION_MINUTES:-5}"
    ports:
      - "${GRPC_WORKS_PORT:-50051}:50051"
    depends_on:
      mysql:
        condition: service_healthy

  # Servidor gRPC Events (Python) - Perfil: grpc
  grpc-events:
    profiles: ["grpc", "full"]
    build:
      context: ./grpc-events
      dockerfile: Dockerfile
    container_name: museo-grpc-events
    restart: unless-stopped
    environment:
      GRPC_PORT: "50052"
      GRPC_MAX_WORKERS: "${GRPC_MAX_WORKERS:-10}"
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-museo_virtual}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_POOL_SIZE: "${DB_POOL_SIZE:-5}"
    ports:
      - "${GRPC_EVENTS_PORT:-50052}:50052"
    depends_on:
      mysql:
        condition: service_healthy

  # Servidor gRPC Users (Python) - Perfil: grpc
  grpc-users:
    profiles: ["grpc", "full"]
    build:
      context: ./grpc-users
      dockerfile: Dockerfile
    container_name: museo-grpc-users
    restart: unless-stopped
    environment:
      GRPC_PORT: "50053"
      GRPC_MAX_WORKERS: "${GRPC_MAX_WORKERS:-10}"
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-museo_virtual}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_POOL_SIZE: "${DB_POOL_SIZE:-5}"
    ports:
      - "${GRPC_USERS_PORT:-50053}:50053"
    depends_on:
      mysql:
        condition: service_healthy

  # API Gateway (Node.js) - Perfil: grpc
  api-gateway:
    profiles: ["grpc", "full"]
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
      additional_contexts:
        protos: ./protos
    container_name: museo-api-gateway
    restart: unless-stopped
    environment:
      PORT: "8090"
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-me-please-0123456789}
      GRPC_WORKS_URL: grpc-works:50051
      GRPC_USERS_URL: grpc-users:50053
      GRPC_EVENTS_URL: grpc-events:50052
    ports:
      - "8090:8090"
    depends_on:
      - grpc-works
      - grpc-events
      - grpc-users

volumes:
  mysql-data:
  kafka-data:
