services:
  # Base de Datos MySQL
  mysql:
    image: mysql:8
    container_name: museo-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-museo_virtual}
      LANG: C.UTF-8
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Copio los scrips e inicializo la BD automáticamente
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servidor Backend REST (Java) - Perfil: rest
  backend-rest:
    profiles: ["rest", "full"]
    build:
      context: ./backend-rest
      dockerfile: Dockerfile
    container_name: museo-backend-rest
    ports:
      - "8081:8081"
    environment:
      # Database Configuration
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-museo_virtual}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-me-please-0123456789}
      JWT_ISSUER: ${JWT_ISSUER:-museo-virtual}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
    depends_on:
      mysql:
        condition: service_healthy

  # Servidor Backend GraphQL (Go) - Perfil: graphql
  backend-graphql:
    profiles: ["graphql", "full"]
    build:
      context: ./backend-graphql
      dockerfile: Dockerfile
    container_name: museo-backend-graphql
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      TP_DISTRIB_DB_ADDR: ${DB_HOST:-mysql}:${DB_PORT:-3306}
      TP_DISTRIB_DB_USERNAME: ${DB_USER:-root}
      TP_DISTRIB_DB_PASSWORD: ${DB_PASSWORD:-root}
      TP_DISTRIB_DB_NAME: ${DB_NAME:-museo_virtual}

      # JWT Configuration (debe coincidir con el backend REST)
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-me-please-0123456789}
      JWT_ISSUER: ${JWT_ISSUER:-museo-virtual}

      PORT: "8082"
    depends_on:
      mysql:
        condition: service_healthy

  # Servidor Proxy (Go) - Perfil: proxy (requiere rest y graphql)
  backend-proxy:
    profiles: ["proxy", "full"]
    build:
      context: ./backend-proxy
      dockerfile: Dockerfile
    container_name: museo-backend-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      REST_TARGET: http://backend-rest:8081
      GQL_TARGET: http://backend-graphql:8082
      GATEWAY_TARGET: http://api-gateway:8090
      PORT: "8080"
    depends_on:
      - backend-rest
      - backend-graphql

  # Servidor gRPC Works (Python) - Perfil: grpc
  grpc-works:
    profiles: ["grpc", "full"]
    build:
      context: ./grpc-works
      dockerfile: Dockerfile
    container_name: museo-grpc-works
    restart: unless-stopped
    environment:
      GRPC_PORT: "50051"
      GRPC_MAX_WORKERS: "${GRPC_MAX_WORKERS:-10}"
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-museo_virtual}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_POOL_SIZE: "${DB_POOL_SIZE:-5}"
      ROOM_TRANSITION_MINUTES: "${ROOM_TRANSITION_MINUTES:-5}"
    ports:
      - "${GRPC_WORKS_PORT:-50051}:50051"
    depends_on:
      mysql:
        condition: service_healthy

  # Servidor gRPC Events (Python) - Perfil: grpc
  grpc-events:
    profiles: ["grpc", "full"]
    build:
      context: ./grpc-events
      dockerfile: Dockerfile
    container_name: museo-grpc-events
    restart: unless-stopped
    environment:
      GRPC_PORT: "50052"
      GRPC_MAX_WORKERS: "${GRPC_MAX_WORKERS:-10}"
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-museo_virtual}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_POOL_SIZE: "${DB_POOL_SIZE:-5}"
    ports:
      - "${GRPC_EVENTS_PORT:-50052}:50052"
    depends_on:
      mysql:
        condition: service_healthy

  # Servidor gRPC Users (Python) - Perfil: grpc
  grpc-users:
    profiles: ["grpc", "full"]
    build:
      context: ./grpc-users
      dockerfile: Dockerfile
    container_name: museo-grpc-users
    restart: unless-stopped
    environment:
      GRPC_PORT: "50053"
      GRPC_MAX_WORKERS: "${GRPC_MAX_WORKERS:-10}"
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-museo_virtual}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_POOL_SIZE: "${DB_POOL_SIZE:-5}"
    ports:
      - "${GRPC_USERS_PORT:-50053}:50053"
    depends_on:
      mysql:
        condition: service_healthy

  # API Gateway (Node.js) - Perfil: grpc
  api-gateway:
    profiles: ["grpc", "full"]
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
      additional_contexts:
        protos: ./protos
    container_name: museo-api-gateway
    restart: unless-stopped
    environment:
      PORT: "8090"
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-me-please-0123456789}
      GRPC_WORKS_URL: grpc-works:50051
      GRPC_USERS_URL: grpc-users:50053
      GRPC_EVENTS_URL: grpc-events:50052
    ports:
      - "8090:8090"
    depends_on:
      - grpc-works
      - grpc-events

volumes:
  mysql-data:
